# yapi: the API server of Yandexnetes.
components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads
            worker_threads#fallback: 8
        fs-task-processor:
            worker_threads: 2
    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $port
                port#fallback: 6443
                task_processor: main-task-processor
                tls:
                    cert: $tls-cert
                    private-key: $tls-key
                handler-defaults:
                    max_request_size: 4194304
                    max_url_size: 16384

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $log-level
                    level#fallback: info
                    overflow_behavior: discard

        dynamic-config:
            defaults: {}

        ydb:
            databases:
                main:
                    endpoint: $ydb-endpoint
                    endpoint#fallback: grpc://ydb:2136
                    database: $ydb-database
                    database#fallback: /local

        yapi-store:
            dbname: main

        yapi-watch: {}
        yapi-bootstrap: {}

        # One handler per path depth; they all are the same API.
        api-0:
            path: '/api'
            method: GET,POST,PUT,PATCH,DELETE
            task_processor: main-task-processor
            response_body_stream: true
            tokens-file: $tokens-file
            openapi-dir: $openapi-dir
            openapi-dir#fallback: ''
        api-1:
            path: '/api/{1}'
            method: GET,POST,PUT,PATCH,DELETE
            task_processor: main-task-processor
            response_body_stream: true
            tokens-file: $tokens-file
            openapi-dir: $openapi-dir
            openapi-dir#fallback: ''
