# yapi: the API server of Yandexnetes.
components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads
            worker_threads#fallback: 8
        fs-task-processor:
            worker_threads: 2
    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $port
                port#fallback: 6443
                task_processor: main-task-processor
                tls:
                    cert: $tls-cert
                    private-key: $tls-key
                handler-defaults:
                    max_request_size: 4194304
                    max_url_size: 16384

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $log-level
                    level#fallback: info
                    overflow_behavior: discard

        dynamic-config:
            defaults: {}

        # YDB asks for secrets; ours runs without any.
        secdist: {}
        default-secdist-provider:
            config: /dev/null
            missing-ok: true

        ydb:
            databases:
                main:
                    endpoint: $ydb-endpoint
                    endpoint#fallback: ydb:2136
                    database: $ydb-database
                    database#fallback: /local

        yapi-store:
            dbname: main

        yapi-watch: {}
        yapi-bootstrap: {}
        yapi-auth:
            tokens-file: $tokens-file
            service-account-key-file: $service-account-key-file
            service-account-key-file#fallback: ''
            service-account-issuer: $service-account-issuer
            service-account-issuer#fallback: https://kubernetes.default.svc.cluster.local
        yapi-services:
            service-cidr: $service-cidr
            service-cidr#fallback: 10.96.0.0/12
            node-port-range: $node-port-range
            node-port-range#fallback: 30000-32767
            advertise-address: $advertise-address
            advertise-address#fallback: ''
            advertise-port: $port
            advertise-port#fallback: 6443
        yapi-crds:
            openapi-dir: $openapi-dir
            openapi-dir#fallback: ''
        dns-client:
            fs-task-processor: fs-task-processor
        http-client-core:
            fs-task-processor: fs-task-processor
            user-agent: yapi
            dns_resolver: getaddrinfo
        http-client: {}
        yapi-webhooks: {}
        yapi-policies: {}
        yapi-protobuf:
            proto-dir: $proto-dir
            proto-dir#fallback: /usr/share/yapi/proto

        # One handler per path depth; they all are the same API.
        api-0:
            path: '/api'
            method: GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS
            task_processor: main-task-processor
            response-body-stream: true
            openapi-dir: $openapi-dir
            openapi-dir#fallback: ''
        api-1:
            path: '/api/{1}'
            method: GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS
            task_processor: main-task-processor
            response-body-stream: true
            openapi-dir: $openapi-dir
            openapi-dir#fallback: ''
