# A single-node YDB: the cluster's storage instead of etcd.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ydb
  namespace: tenant-yanetes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: replicated
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ydb
  namespace: tenant-yanetes
  labels:
    app: ydb
spec:
  hostname: ydb
  terminationGracePeriodSeconds: 30
  containers:
  - name: ydb
    image: ydbplatform/local-ydb:latest
    env:
    - {name: GRPC_PORT, value: "2136"}
    - {name: MON_PORT, value: "8765"}
    - {name: YDB_DEFAULT_LOG_LEVEL, value: NOTICE}
    # The image makes its certificates on first start only; keep them with
    # the data, or a restarted container finds the data but not the CA.
    - {name: YDB_GRPC_ENABLE_TLS, value: "false"}
    ports:
    - {name: grpc, containerPort: 2136}
    - {name: mon, containerPort: 8765}
    resources:
      requests: {cpu: "2", memory: 8Gi}
      limits: {cpu: "8", memory: 16Gi}
    volumeMounts:
    - {name: data, mountPath: /ydb_data, subPath: data}
    - {name: data, mountPath: /ydb_certs, subPath: certs}
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ydb
---
apiVersion: v1
kind: Service
metadata:
  name: ydb
  namespace: tenant-yanetes
spec:
  selector:
    app: ydb
  ports:
  - {name: grpc, port: 2136}
  - {name: mon, port: 8765}
