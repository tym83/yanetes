#cloud-config
# A Яnetes worker: upstream containerd, kubelet, kube-proxy and
# flannel on Ubuntu, pointed at yapi. Rendered by hack/workshop/node.sh,
# which fills in the @PLACEHOLDERS@.
hostname: @NAME@
ssh_authorized_keys:
  - @SSH_KEY@
package_update: true
packages: [iptables, conntrack, socat, ethtool, curl]
write_files:
  - path: /etc/modules-load.d/yanetes.conf
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/90-yanetes.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  - path: /etc/yanetes/ca.crt
    encoding: b64
    content: @CA@
  - path: /etc/yanetes/kubelet.conf
    content: |
      apiVersion: v1
      kind: Config
      clusters: [{name: yanetes, cluster: {server: "@API@", certificate-authority: /etc/yanetes/ca.crt}}]
      users: [{name: node, user: {token: "@TOKEN@"}}]
      contexts: [{name: node, context: {cluster: yanetes, user: node}}]
      current-context: node
  - path: /etc/yanetes/kube-proxy.conf
    content: |
      apiVersion: v1
      kind: Config
      clusters: [{name: yanetes, cluster: {server: "@API@", certificate-authority: /etc/yanetes/ca.crt}}]
      users: [{name: kube-proxy, user: {token: "@PROXY_TOKEN@"}}]
      contexts: [{name: kube-proxy, context: {cluster: yanetes, user: kube-proxy}}]
      current-context: kube-proxy
  - path: /var/lib/kubelet/config.yaml
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      authentication:
        anonymous: {enabled: true}
        webhook: {enabled: false}
      authorization: {mode: AlwaysAllow}
      cgroupDriver: systemd
      clusterDNS: [10.112.0.10]
      clusterDomain: cluster.local
      containerRuntimeEndpoint: unix:///run/containerd/containerd.sock
      kubeAPIContentType: application/json
      resolvConf: /run/systemd/resolve/resolv.conf
      failSwapOn: false
  - path: /etc/yanetes/kube-proxy.yaml
    content: |
      apiVersion: kubeproxy.config.k8s.io/v1alpha1
      kind: KubeProxyConfiguration
      clientConnection: {kubeconfig: /etc/yanetes/kube-proxy.conf, contentType: application/json}
      clusterCIDR: 10.113.0.0/16
      mode: iptables
      hostnameOverride: @NAME@
  - path: /etc/kube-flannel/net-conf.json
    content: |
      {"Network": "10.113.0.0/16", "EnableNFTables": false, "Backend": {"Type": "vxlan"}}
  - path: /etc/cni/net.d/10-flannel.conflist
    content: |
      {"name": "cbr0", "cniVersion": "0.3.1", "plugins": [
        {"type": "flannel", "delegate": {"hairpinMode": true, "isDefaultGateway": true}},
        {"type": "portmap", "capabilities": {"portMappings": true}}]}
  - path: /etc/systemd/system/kubelet.service
    content: |
      [Unit]
      After=containerd.service flanneld.service
      Wants=containerd.service
      [Service]
      ExecStart=/usr/local/bin/kubelet --kubeconfig=/etc/yanetes/kubelet.conf --config=/var/lib/kubelet/config.yaml --hostname-override=@NAME@
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/kube-proxy.service
    content: |
      [Unit]
      After=network-online.target
      [Service]
      ExecStart=/usr/local/bin/kube-proxy --config=/etc/yanetes/kube-proxy.yaml
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/flanneld.service
    content: |
      [Unit]
      After=network-online.target
      [Service]
      Environment=NODE_NAME=@NAME@
      ExecStart=/usr/local/bin/flanneld --kube-subnet-mgr --kubeconfig-file=/etc/yanetes/kube-proxy.conf --ip-masq
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
runcmd:
  - modprobe overlay; modprobe br_netfilter; sysctl --system
  - |
    set -e
    cd /tmp
    curl -fsSLo containerd.tgz https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-linux-amd64.tar.gz
    tar -C /usr/local -xzf containerd.tgz
    curl -fsSLo /etc/systemd/system/containerd.service https://raw.githubusercontent.com/containerd/containerd/v2.4.2/containerd.service
    curl -fsSLo /usr/local/sbin/runc https://github.com/opencontainers/runc/releases/download/v1.5.2/runc.amd64 && chmod +x /usr/local/sbin/runc
    mkdir -p /opt/cni/bin /etc/containerd
    curl -fsSL https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-amd64-v1.9.1.tgz | tar -C /opt/cni/bin -xz
    curl -fsSLo /opt/cni/bin/flannel https://github.com/flannel-io/cni-plugin/releases/download/v1.9.1-flannel3/flannel-amd64 && chmod +x /opt/cni/bin/flannel
    curl -fsSLo /usr/local/bin/flanneld https://github.com/flannel-io/flannel/releases/download/v0.28.10/flanneld-amd64 && chmod +x /usr/local/bin/flanneld
    for b in kubelet kube-proxy; do curl -fsSLo /usr/local/bin/$b https://dl.k8s.io/v1.37.1/bin/linux/amd64/$b && chmod +x /usr/local/bin/$b; done
    /usr/local/bin/containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    systemctl daemon-reload
    systemctl enable --now containerd flanneld kube-proxy kubelet
